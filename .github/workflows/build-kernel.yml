name: Build kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: '内核名（最终: 4.14.336-<名>-<后缀>-<日期>）'
        required: false
        default: 'wakmemlody'
        type: string
      kernel_suffix:
        description: '内核名后缀（留空则不加后缀）'
        required: false
        default: 'nabu-hyperos1'
        type: string
      ksu_variant:
        description: 'KernelSU 变体'
        required: false
        default: 'KernelSU-Next'
        type: choice
        options:
          - KernelSU-Next
          - none
      extra_config:
        description: '追加 defconfig 项，逗号分隔（验证请看产物 build.config，勿用 /proc/config.gz）'
        required: false
        default: ''
        type: string
      build_boot_images:
        description: '合成 boot.img / vendor_boot.img（需 stock/ 下有原厂参考镜像）'
        required: false
        default: true
        type: boolean
      ikconfig_stock_masquerade:
        description: '伪装 /proc/config.gz 为原厂配置（HyperOS 必开，见 DROIDSPACES.md 第七节；关闭会弹「设备内部出现问题」）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      KERNEL_NAME: ${{ inputs.kernel_name }}
      KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
      # build.sh 读它决定是否合成 boot.img / vendor_boot.img
      BUILD_BOOT_IMAGES: ${{ inputs.build_boot_images }}
      # build.sh 读它决定 /proc/config.gz 内嵌真实 .config 还是原厂伪装配置
      IKCONFIG_STOCK_MASQUERADE: ${{ inputs.ikconfig_stock_masquerade && '1' || '0' }}
      # 存放原厂 boot/vendor_boot 参考件的 Release tag（资产不入库，见 Fetch 步骤）
      STOCK_REF_TAG: stock-ref

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show build parameters
        shell: bash
        run: |
          set -euo pipefail
          echo "内核名     : ${KERNEL_NAME}"
          echo "后缀       : ${KERNEL_SUFFIX:-(无)}"
          echo "KSU 变体   : ${{ inputs.ksu_variant }}"
          echo "额外配置   : ${{ inputs.extra_config }}"
          echo "合成 boot  : ${{ inputs.build_boot_images }}"
          echo "config.gz  : ${{ inputs.ikconfig_stock_masquerade && '伪装原厂配置' || '真实 .config' }}"
          if [[ -z "${KERNEL_NAME// }" ]]; then
            echo "::error::kernel_name 不能为空"
            exit 1
          fi
          # 内核名会进 CONFIG_LOCALVERSION，含空格或斜杠会破坏构建
          if [[ "$KERNEL_NAME$KERNEL_SUFFIX" =~ [[:space:]/] ]]; then
            echo "::error::内核名与后缀不能含空格或斜杠"
            exit 1
          fi

      - name: Install Python 2
        shell: bash
        run: |
          set -euo pipefail
          sudo env INSTALL_PIP=0 bash "$GITHUB_WORKSPACE/.github/install-python2.sh"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          python2.7 --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            make \
            zip

      - name: Install Clang A15 toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/clang-A15.tar.xz"
          toolchain_dir="$RUNNER_TEMP/clang-A15"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/Kuugo2002/xiaomi_kernel_nabu/releases/download/v0.1/clang-A15.tar.xz
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          test -x "$toolchain_dir/bin/clang"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
          "$toolchain_dir/bin/clang" --version

      - name: Apply extra defconfig entries
        if: inputs.extra_config != ''
        shell: bash
        run: |
          set -euo pipefail
          dc=arch/arm64/configs/nabu_defconfig
          # 追加在末尾即可覆盖前面的声明（内核 Kconfig 后者生效）
          printf '\n# --- injected by workflow_dispatch ---\n' >> "$dc"
          IFS=',' read -ra items <<< "${{ inputs.extra_config }}"
          for item in "${items[@]}"; do
            entry="$(echo "$item" | xargs)"
            [[ -z "$entry" ]] && continue
            if [[ ! "$entry" =~ ^CONFIG_[A-Z0-9_]+=(y|m|n|\".*\"|[0-9]+)$ ]]; then
              echo "::error::配置项格式不合法: $entry"
              exit 1
            fi
            # =n 要写成 not set 的形式才是真正关闭
            if [[ "$entry" =~ ^(CONFIG_[A-Z0-9_]+)=n$ ]]; then
              echo "# ${BASH_REMATCH[1]} is not set" >> "$dc"
              echo "  关闭 ${BASH_REMATCH[1]}"
            else
              echo "$entry" >> "$dc"
              echo "  追加 $entry"
            fi
          done

      - name: Remove KernelSU
        if: inputs.ksu_variant == 'none'
        shell: bash
        run: |
          set -euo pipefail
          dc=arch/arm64/configs/nabu_defconfig
          printf '\n# --- KSU disabled by workflow_dispatch ---\n' >> "$dc"
          echo '# CONFIG_KSU is not set' >> "$dc"
          echo "已关闭 CONFIG_KSU"

      # 原厂参考件不入库（boot 参考件 18.9 MiB，二进制在 git 历史里无法增量存储），
      # 改从 Release 拉。它们只提供 ramdisk / os_version / cmdline / 各 addr，
      # 内核与 dtb 都会被本次构建的新产物替换，故内容与内核版本无关，一次上传长期复用。
      # 制作方法见 tools/make_stock_ref.py（可直接喂整分区 dd 件）。
      - name: Fetch stock reference images
        if: inputs.build_boot_images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stock
          missing=0
          for f in boot-ref.img vendor_boot-ref.img; do
            if gh release download "$STOCK_REF_TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$f" --dir stock --clobber 2>/dev/null; then
              echo "已取得 stock/$f（$(stat -c%s "stock/$f") 字节）"
            else
              echo "::error::Release '$STOCK_REF_TAG' 缺少资产 $f"
              missing=1
            fi
          done
          if (( missing )); then
            echo "::error::build_boot_images=true 但拿不到原厂参考件，无法合成 boot 镜像。"
            echo "::error::请先建 tag '$STOCK_REF_TAG' 的 Release 并上传 boot-ref.img / vendor_boot-ref.img"
            echo "::error::（用 tools/make_stock_ref.py 从原厂分区裁出），或把 build_boot_images 设为 false。"
            exit 1
          fi
          # 参考件必须是合法 v3 镜像，坏文件要在编译前就拦住
          python3 - <<'PY'
          import struct, sys
          for path, magic, name in (
              ("stock/boot-ref.img", b"ANDROID!", "boot"),
              ("stock/vendor_boot-ref.img", b"VNDRBOOT", "vendor_boot"),
          ):
              buf = open(path, "rb").read()
              if buf[:8] != magic:
                  sys.exit(f"::error::{path} magic 不对（{buf[:8]!r}），不是 {name} 镜像")
              hv = struct.unpack("<I", buf[40:44] if name == "boot" else buf[8:12])[0]
              if hv != 3:
                  sys.exit(f"::error::{path} 是 header v{hv}，需要 v3")
              print(f"[OK] {path} 是合法 {name} v3 镜像")
          PY

      - name: Build kernel and AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          chmod +x build.sh
          ./build.sh nabu -j"$(nproc)"

      - name: Stage AnyKernel3 package
        id: stage_package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          packages=(../Releases_nabu_*/*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one AnyKernel3 package, found ${#packages[@]}" >&2
            exit 1
          fi
          package_filename="$(basename "${packages[0]}")"
          echo "artifact_name=${package_filename%.zip}" >> "$GITHUB_OUTPUT"
          unzip -q "${packages[0]}" -d artifacts

          # 一并收上 build.sh 合成的 boot 镜像。
          # 若用户要求了合成（build_boot_images=true），缺产物就是硬错误 ——
          # 参考件已在前面的 Fetch 步骤校验过，走到这里还缺说明合成真的失败了，
          # 不能像以前那样只打一句 note 就放过（那会让人以为刷机包是完整的）。
          for img in boot.img vendor_boot.img; do
            src="$(dirname "${packages[0]}")/$img"
            if [[ -f "$src" ]]; then
              cp "$src" artifacts/
              echo "collected $img ($(stat -c%s "$src") bytes)"
            elif [[ "${BUILD_BOOT_IMAGES}" == "true" ]]; then
              echo "::error::build_boot_images=true 但 $img 未生成（参考件已就位，合成环节失败）"
              exit 1
            else
              echo "note: $img absent (build_boot_images=false)"
            fi
          done

          # 硬校验：dtb 必须含 RTIC FDT，缺它设备无法启动
          python3 "$GITHUB_WORKSPACE/tools/verify_rtic_present.py" artifacts/dtb

          # 硬校验：FDT 顺序必须与原厂一致。设备 androidboot.dtb_idx=1
          # 按索引取第 2 个 FDT，顺序错会拿到别款芯片的设备树而无法启动。
          python3 "$GITHUB_WORKSPACE/tools/reorder_dtb.py" --check artifacts/dtb

          # 记录实际内核名，方便对账
          strings artifacts/Image | grep -m1 '^Linux version' | tee artifacts/KERNEL_VERSION.txt

          # 收上真实的 .config 作为该次构建配置的权威记录。
          #
          # 历史背景：kernel/Makefile 曾把 config_data.gz 的依赖从
          # $(KCONFIG_CONFIG) 改成硬编码的 arch/arm64/configs/nabu-stock_defconfig
          # （提交 26fb633ed1，源自 Pixel/marlin，为躲会读 config.gz 的
          # userspace 检查），导致 /proc/config.gz 与 Image 内嵌 IKCFG 段永远
          # 输出原厂假配置 —— 曾造成「CONFIG_PROC_CHILDREN 配了没生效」的误判
          # （实际已生效，是 config.gz 在说谎）。现已改为默认输出真实 .config，
          # 伪装行为退化为可选开关 IKCONFIG_STOCK_MASQUERADE=1。
          # 下面的 IKCFG 一致性门禁会守住这个契约，防止再次回退。
          real_config="$(dirname "${packages[0]}")/.config"
          if [[ -f "$real_config" ]]; then
            cp "$real_config" artifacts/build.config
            echo "collected build.config ($(wc -l < artifacts/build.config) lines)"
          else
            # 退路：从内核源码树找
            for c in .config out/.config; do
              if [[ -f "$c" ]]; then
                cp "$c" artifacts/build.config
                echo "collected build.config from $c"
                break
              fi
            done
          fi

          # 断言我们加的配置真的被 Kconfig 采纳了。
          # 依赖未满足时 Kconfig 会静默丢弃，只看 defconfig 里写了什么不够。
          if [[ -f artifacts/build.config ]]; then
            missing=0
            for opt in CONFIG_UNIX_DIAG CONFIG_SQUASHFS CONFIG_BINFMT_MISC \
                       CONFIG_PROC_CHILDREN CONFIG_USER_NS; do
              if grep -qx "$opt=y" artifacts/build.config; then
                echo "OK   $opt=y"
              else
                echo "::error::$opt 未被 Kconfig 采纳（检查依赖是否满足）"
                missing=1
              fi
            done
            [[ $missing -eq 0 ]] || exit 1
          else
            echo "::warning::找不到真实 .config，跳过配置断言"
          fi

          # 硬校验：Image 内嵌的 IKCFG 段（即设备上 /proc/config.gz 的内容）
          # 必须等于本次构建真实的 .config，否则 config.gz 会对 userspace 说谎，
          # 任何人拿 zcat /proc/config.gz 验证配置都会被误导。
          # 开了伪装开关时反向断言（内嵌应确为原厂配置，而非静默失效）。
          if [[ -f artifacts/build.config && -f artifacts/Image ]]; then
            if [[ "${IKCONFIG_STOCK_MASQUERADE:-0}" == "1" ]]; then
              python3 "$GITHUB_WORKSPACE/tools/verify_ikconfig.py" \
                --expect-masquerade artifacts/Image artifacts/build.config
            else
              python3 "$GITHUB_WORKSPACE/tools/verify_ikconfig.py" \
                artifacts/Image artifacts/build.config
            fi
          else
            echo "::warning::缺 build.config 或 Image，跳过 IKCFG 一致性校验"
          fi

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage_package.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
